<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{{ book[1] }} - 图书详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 30px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .star-rating {
            color: #FFD700;
        }
        .book-image {
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        .back-btn {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="/" class="btn btn-outline-primary rounded-full px-4">← 返回图书列表</a>
            <div class="text-right">
                <p class="text-gray-600">欢迎回来，<span class="font-semibold text-primary">{{ user.username }}</span></p>
                <a href="/logout" class="btn btn-sm btn-outline-danger rounded-full">登出</a>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-4">
                <img src="{{ book[7] }}" class="img-fluid book-image" style="max-height:450px;object-fit:cover;">
            </div>
            <div class="col-md-8">
                <h1 class="text-3xl font-bold text-primary mb-3">{{ book[1] }}</h1>
                
                <div class="row mb-4">
                    <div class="col-md-6">
                        <span class="text-gray-500">分类：</span>
                        <span class="font-medium text-gray-800">{{ book[4] }}</span>
                    </div>
                    <div class="col-md-6">
                        <span class="text-gray-500">价格：</span>
                        <span class="text-xl font-bold text-primary">£{{ book[2] }}</span>
                    </div>
                </div>
                
                <div class="row mb-4">
                    <div class="col-md-6">
                        <span class="text-gray-500">评分：</span>
                        <span class="star-rating text-lg">
                            {% for i in range(book[3]) %}★{% endfor %}
                            {% for i in range(5-book[3]) %}☆{% endfor %}
                        </span>
                    </div>
                    <div class="col-md-6">
                        <span class="text-gray-500">库存：</span>
                        <span class="font-medium {% if book[5]|int > 0 %}text-green-600{% else %}text-red-600{% endif %}">
                            {% if book[5]|int > 0 %}有货 ({{ book[5] }}){% else %}缺货{% endif %}
                        </span>
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="d-flex gap-3">
                        <form action="/toggle_favorite" method="post" class="flex-1">
                            <input type="hidden" name="book_id" value="{{ book[0] }}">
                            <input type="hidden" name="page" value="1">
                            <button type="submit" class="btn w-full {% if book[0] in favorite_ids %}btn-danger{% else %}btn-outline-danger{% endif %} rounded-lg">
                                {% if book[0] in favorite_ids %}❤️ 已收藏{% else %}🤍 收藏这本书{% endif %}
                            </button>
                        </form>
                        <form action="/buy" method="post">
                            <input type="hidden" name="book_id" value="{{ book[0] }}">
                            <button type="submit" class="btn btn-success rounded-lg px-6" {% if book[5] <= 0 %}disabled{% endif %}>
                                💰 立即购买 £{{ book[2] }}
                            </button>
                        </form>
                    </div>
                </div>
                
                <div class="bg-light p-4 rounded-lg">
                    <h3 class="font-semibold text-gray-800 mb-2">📖 书籍简介</h3>
                    <p class="text-gray-600">{{ book[6] }}</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
